AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 creada desde GitHub Actions

Resources:
  # 1. CREAMOS EL GRUPO DE SEGURIDAD
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permitir trafico HTTP entrante
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0 # Abre el puerto 80 para cualquier IP en internet
          # Vinculamos el grupo de seguridad de arriba a esta instancia
      SecurityGroups: -!Ref MySecurityGroup
  MyEC2:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: ami-0cca150d127c2216f
      InstanceType: t3.

      # ─── AQUÍ ESTÁ TU USER DATA BIEN ENCAJADO ───
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Actualizar paquetes del sistema
          yum update -y

          # Instalar el servidor web Apache
          yum install -y httpd

          # Iniciar Apache y hacer que encienda automáticamente con la EC2
          systemctl start httpd
          systemctl enable httpd

          # Crear una página web de prueba básica
          echo "<h1>¡Servidor Web Activo! Desplegado desde GitHub Actions</h1>" > /var/www/html/index.html

      Tags:
        - Key: Name
          Value: EC2-GitHubActions
