AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 modificada forzada hoy v3
Resources:
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permitir trafico HTTP entrante
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  # ─── CAMBIO AQUÍ: LE CAMBIAMOS EL NOMBRE AL RECURSO ───
  MyNewEC2:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: ami-0cca150d127c2216f
      InstanceType: t3.micro

      # Forzamos la IP pública real y le asignamos el grupo de seguridad
      NetworkInterfaces:
        - AssociatePublicIpAddress: "true"
          DeviceIndex: "0"
          GroupSet:
            - Fn::GetAtt: [MySecurityGroup, GroupId]

      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Desactivar el firewall interno de Red Hat para evitar bloqueos
          systemctl stop firewalld
          systemctl disable firewalld
          
          # Instalar e iniciar Apache
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd

          # Crear la página de prueba
          echo "<h1>¡Servidor Web Activo! Desplegado desde GitHub Actions Todo Melo</h1>" > /var/www/html/index.html

      Tags:
        - Key: Name
          Value: EC2-Nueva-GitHubActions  # Le cambiamos el tag para reconocerla