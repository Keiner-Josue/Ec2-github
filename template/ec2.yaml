AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 creada desde GitHub Actions con correccion de Firewall interno

Resources:
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permitir trafico HTTP entrante
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  MyEC2:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: ami-0cca150d127c2216f
      InstanceType: t3.micro

      SecurityGroupIds:
        - Fn::GetAtt: [MySecurityGroup, GroupId]

      UserData:
        Fn::Base64: |
          #!/bin/bash
          # 1. Actualizar e instalar Apache
          yum update -y
          yum install -y httpd

          # 2. INICIAR APACHE
          systemctl start httpd
          systemctl enable httpd

          # 3. CREAR LA PÁGINA WEB
          echo "<h1>¡Servidor Web Activo! Desplegado desde GitHub Actions</h1>" > /var/www/html/index.html

          # 4. ─── NUEVO: ABRIR EL PUERTO EN EL CORTAFUEGOS INTERNO DE RED HAT ───
          if systemctl is-active --quiet firewalld; then
            firewall-cmd --permanent --add-service=http
            firewall-cmd --reload
          fi

      Tags:
        - Key: Name
          Value: EC2-GitHubActions
